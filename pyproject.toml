[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sarkhati-bourse-dackeh"
version = "4.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7", "dbus-next>=0.2.3"]

[project.scripts]
